.count{font-size:12px;color:var(--muted);white-space:nowrap}

.phrase{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:170px}
.topline{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:11px;color:var(--blue);background:var(--soft);padding:4px 8px;border-radius:999px}
.star{border:0;background:transparent;font-size:20px;color:#aab2ba;cursor:pointer;padding:0 3px}
.star.saved{color:#d69b19}
.target-text{font-size:21px;font-weight:700;line-height:1.35;letter-spacing:.1px;color:#16222f}
.chinese{font-size:14px;color:#4c5966;line-height:1.5}
.hint{font-size:12px;color:#89939c}
.actions{display:flex;gap:8px;margin-top:auto}
.play{border:0;border-radius:10px;background:var(--blue);color:white;padding:10px 13px;cursor:pointer;font-size:13px;flex:1;font-weight:500}
.play:hover{background:#174766}

.slow:hover{background:#eef3f7}

</main>

let currentLang = "de";
let activeUnit = "basic";
let onlyFav = false;
let favorites = new Set(JSON.parse(localStorage.getItem("polyglot-favs") || "[]"));

const langBar = document.getElementById("langBar");
const tabs = document.getElementById("tabs");
const cards = document.getElementById("cards");
const search = document.getElementById("search");

function saveFav() {
  localStorage.setItem("polyglot-favs", JSON.stringify([...favorites]));
}

function renderLangBar() {
  langBar.innerHTML = "";
  Object.keys(db).forEach(code => {
    const btn = document.createElement("button");
    btn.className = "lang-btn" + (code === currentLang ? " active" : "");
    btn.textContent = db[code].label;
    btn.onclick = () => {
      currentLang = code;
      activeUnit = db[code].units[0].id;
      onlyFav = false;
      document.getElementById("favOnly").classList.remove("active");
      document.getElementById("allItems").classList.add("active");
      updateHeader();
      renderLangBar();
      renderTabs();
      renderCards();
    };
    langBar.appendChild(btn);
  });
}

function updateHeader() {
  const L = db[currentLang];
  document.getElementById("headerKicker").textContent = L.kicker;
  document.getElementById("headerTitle").textContent = L.title;
  document.getElementById("headerSub").textContent = L.sub;
}

function renderTabs() {
  tabs.innerHTML = "";
  db[currentLang].units.forEach(u => {
    const b = document.createElement("button");
    b.className = "tab" + (u.id === activeUnit && !onlyFav ? " active" : "");
    b.textContent = u.name;
    b.onclick = () => {
      activeUnit = u.id;
      onlyFav = false;
      document.getElementById("favOnly").classList.remove("active");
      document.getElementById("allItems").classList.add("active");
      renderTabs();
      renderCards();
    };
    tabs.appendChild(b);
  });
}

// 修正後的語音播放函式：強化慢速區別 (0.55 vs 0.95) 並解決 Chrome cancel 延遲問題
function speak(text, rate = 0.95) {
  if (!("speechSynthesis" in window)) {
    alert("這個瀏覽器不支援語音播放，請改用最新版 Chrome。");
    return;
  }
  window.speechSynthesis.cancel();
  const targetLang = db[currentLang].langCode;
  const prefix = targetLang.split("-")[0].toLowerCase();

  setTimeout(() => {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = targetLang;
    utter.rate = rate;
    utter.pitch = 1.0;

    const voices = window.speechSynthesis.getVoices();
    // 優先尋找 Google 雲端語音（對語速調整最敏感且發音最自然），其次找本機對應語言
    const matchedVoice =
      voices.find(v => v.lang.toLowerCase() === targetLang.toLowerCase() && v.name.includes("Google")) ||
      voices.find(v => v.lang.toLowerCase().startsWith(prefix) && v.name.includes("Google")) ||
      voices.find(v => v.lang.toLowerCase() === targetLang.toLowerCase()) ||
      voices.find(v => v.lang.toLowerCase().startsWith(prefix));

    if (matchedVoice) {
      utter.voice = matchedVoice;
    }
    window.speechSynthesis.speak(utter);
  }, 40);
}

function renderCards() {
  const L = db[currentLang];
  const unit = L.units.find(u => u.id === activeUnit) || L.units[0];
  document.getElementById("sectionTitle").textContent = onlyFav ? `${L.label}｜我的收藏` : unit.name;
  document.getElementById("sectionDesc").textContent = onlyFav ? "已收藏的常用句，可隨時切換常速與慢速聆聽。" : unit.desc;

  let items = L.units.flatMap(u =>
    u.items.map((it, i) => ({
      text: it[0],
      zh: it[1],
      hint: it[2],
      unit: u,
      key: `${currentLang}-${u.id}-${i}`
    }))
  );

  if (!onlyFav) {
    items = items.filter(x => x.unit.id === activeUnit);
  } else {
    items = items.filter(x => favorites.has(x.key));
  }

  const q = search.value.trim().toLowerCase();
  if (q) {
    items = items.filter(x =>
      x.text.toLowerCase().includes(q) ||
      x.zh.toLowerCase().includes(q) ||
      x.hint.toLowerCase().includes(q) ||
      x.unit.name.toLowerCase().includes(q)
    );
  }

  document.getElementById("count").textContent = items.length + " 句";
  cards.innerHTML = "";

  if (!items.length) {
    cards.innerHTML = '<div class="empty">沒有找到符合的內容。<br>試試其他關鍵字，或先點擊卡片右上角的 ☆ 收藏常用句。</div>';
    return;
  }

  items.forEach(x => {
    const article = document.createElement("article");
    article.className = "phrase";

    const top = document.createElement("div");
    top.className = "topline";

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = x.unit.name;

    const star = document.createElement("button");
    star.className = "star" + (favorites.has(x.key) ? " saved" : "");
    star.textContent = favorites.has(x.key) ? "★" : "☆";
    star.title = "加入／取消收藏";
    star.onclick = () => {
      favorites.has(x.key) ? favorites.delete(x.key) : favorites.add(x.key);
      saveFav();
      renderCards();
    };
    top.append(tag, star);

    const targetEl = document.createElement("div");
    targetEl.className = "target-text";
    targetEl.textContent = x.text;

    const zh = document.createElement("div");
    zh.className = "chinese";
    zh.textContent = x.zh;

    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = x.hint;

    const actions = document.createElement("div");
    actions.className = "actions";

    const play = document.createElement("button");
    play.className = "play";
    play.innerHTML = "🔊 聽發音";
    play.onclick = () => speak(x.text, 0.95);

    const slow = document.createElement("button");
    slow.className = "slow";
    slow.innerHTML = "🐢 慢速";
    slow.onclick = () => speak(x.text, 0.55);

    actions.append(play, slow);
    article.append(top, targetEl, zh, hint, actions);
    cards.appendChild(article);
  });
}

search.addEventListener("input", renderCards);
document.getElementById("favOnly").onclick = () => {
  onlyFav = true;
  document.getElementById("favOnly").classList.add("active");
  document.getElementById("allItems").classList.remove("active");
  renderTabs();
  renderCards();
};
document.getElementById("allItems").onclick = () => {
  onlyFav = false;
  document.getElementById("favOnly").classList.remove("active");
  document.getElementById("allItems").classList.add("active");
  renderTabs();
  renderCards();
};

updateHeader();
renderLangBar();
renderTabs();
renderCards();

if ("speechSynthesis" in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
</script>
</body>
</html>
